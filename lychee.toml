# Link-checker config. Internal relative links (incl. the committed PDFs) are checked normally.
# External hosts that bot-block or that we cite by number rather than assert as live are excluded.
# 415 = WAF rejecting lychee's HEAD probe (the host serves the page fine to a GET/browser).
accept = [200, 202, 206, 403, 415, 429]
max_retries = 3
retry_wait_time = 2
timeout = 30
# Placeholder templates carry <PLACEHOLDER> link destinations, not real links — don't scan them.
exclude_path = ["STATUS.template.md"]
exclude = [
  "^https://data\\.consilium\\.europa\\.eu",   # register 404s for unreleased LIMITE docs (cited by number)
  "^https://eur-lex\\.europa\\.eu",            # returns 202 to automated clients
  "^https://oeil\\.europarl\\.europa\\.eu",    # bot-sensitive
  "^https://www\\.linkedin\\.com",             # blocks automated access
  "^https://zoek\\.officielebekendmakingen\\.nl",
  "^https://open\\.overheid\\.nl",             # blocks automated access (NL government document host)
  "^https://www\\.tweedekamer\\.nl",           # bot-sensitive download endpoints (cited by document number)
  "^https://www\\.rijksoverheid\\.nl",         # bot-sensitive (mirror copies, cited by date)
  "^https://www\\.computable\\.nl",            # bot-blocks / paywalled press host
  "^https://ieu-monitoring\\.com",             # slow host; times out for the CI link checker (mirror copies)
  "^https://bits-chips\\.com",                 # trade press; times out for the CI link checker (cited by headline+date)
  "^https://publications\\.jrc\\.ec\\.europa\\.eu",  # JRC repository; slow, times out for automated clients
  "^https://www\\.digitaleoverheid\\.nl",      # WAF rejects HEAD (415) under load
]
