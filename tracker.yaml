# ============================================================================
# tracker.yaml — the SINGLE source of truth for this tracker's file identity.
#
# This is the one place that says *which* EU file this repo follows. Everything
# else (CLAUDE.md, README.md, STATUS.md, the skills' scope checks) reads from
# here or is filled from here by `python3 bootstrap.py`.
#
# This tracker follows file 2026/0139 (COD) — the Chips Act 2.0, part of the
# European Technological Sovereignty Package (3 June 2026).
# ============================================================================

# --- Identity ---------------------------------------------------------------
file_id: "2026/0139 (COD)"                # interinstitutional file number + procedure type
short_name: "Chips Act 2.0"
strand: "Union semiconductor ecosystem — Chips for Europe Initiative 2.0 (Grand Challenges, Demand Accelerators, chip innovation procurement), strategic projects and fast-track permitting (≤12 months), European Semiconductor Regions of Excellence, supply-chain monitoring and crisis response, European Semiconductor Board"

proposal:
  id: "COM(2026) 504"                     # Commission proposal id (without "final")
  date: "2026-06-03"                      # ISO
  swd: "SWD(2026) 504"                    # accompanying impact assessment (Parts 1/3–3/3; summary = SWD(2026) 505)
  celex: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0504"
  oeil: "https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2026/0139(COD)"

# Sibling file(s) that are easy to confuse with this one and must NOT be tracked
# here. Drives the scope-guard text in CLAUDE.md/README and the skills' scope rule.
keep_apart:
  - file_id: "2026/0138 (COD)"
    note: "Cloud and AI Development Act (CADA, COM(2026) 502) — the other legislative half of the same Tech Sovereignty Package; tracked in its own sibling repo"
# The package's two NON-legislative parts (EU Open Source Strategy; Strategic
# Roadmap for Digitalisation and AI in Energy) are tracked here only where they
# touch the semiconductor strand (e.g. demand-side links to data centres / AI
# Gigafactories).

legal_bases: ["Article 173(3) TFEU", "Article 114 TFEU"]   # per the citations of COM(2026) 504

# Existing laws this file amends/repeals. Drives docs/instruments/ pages.
# Chips Act 2.0 REPEALS Regulation (EU) 2023/1781 (the 2023 Chips Act) — Art 58,
# with transitional provisions in Art 59 and a correlation table in Annex VII.
# NOTE: the SWD(2026) 504/505 cover pages misprint the repealed act as
# "Regulation (EU) 2023/1782"; the proposal cover page and Art 58 say 2023/1781.
instruments:
  - { name: "European Chips Act (repealed)", celex: "2023/1781" }

# The per-version operative-text file set under extracts/. EACH compromise
# version gets one file per slice, named ST-<nnnn>-<yyyy>_<slice>.md, so
# `git diff` between versions lines up.
# Follows COM(2026) 504's own Chapter/Section structure (60 articles, 8 chapters).
extract_slices:
  - general-provisions-art1-2            # Ch I — subject matter, definitions
  - chips-initiative-art3-12             # Ch II — Chips for Europe Initiative 2.0: objectives, competence centres, Grand Challenges, Demand Accelerators, Demand Forum, chip innovation procurement
  - manufacturing-capabilities-art13-20  # Ch III s1 — public interest/support, European semiconductor technology initiatives, strategic projects, financing coordination
  - permitting-art21-25                  # Ch III s2 — fast-track permitting, one-stop shop, single access portal / European Business Wallets
  - regions-of-excellence-art26-29       # Ch III s3 — European Semiconductor Region of Excellence label, investment plans, network
  - supply-chain-resilience-art30-32     # Ch III s4 — public procurement, further procurement actions, risk-prone sectors
  - monitoring-art33-36                  # Ch IV s1 — strategic mapping, B2B supply-chain platform, monitoring and anticipation, key market actors
  - alerts-crisis-response-art37-43      # Ch IV s2+s3 — alerts/preventive action, crisis stage, emergency toolbox, priority-rated orders, common purchasing
  - governance-art44-49                  # Ch V — European Semiconductor Board, NCAs, Industrial Alliance for Semiconductors
  - confidentiality-penalties-art50-54   # Ch VI — confidential information, penalties, limitation periods, right to be heard
  - delegation-final-provisions-art55-60 # Ch VII+VIII — delegation, comitology, evaluation, repeal of Reg (EU) 2023/1781, transitional, entry into force
  - recitals

# OLP actor skeleton for STATUS.md "Where each institution stands".
co_legislators:
  council:
    config: "COMPET.1 secretariat lead (per ST 10094/26 cover note routing: COMPET 666, IND 388, MI 582, RC 13, RECH 258, TELECOM 290, FIN 812, CADREFIN 262, CODEC 1088) — competitiveness/industry working party expected; verify once the Presidency schedules first examination"
  parliament:
    committees_responsible: []            # not yet appointed; ITRE expected (verify)
    committees_opinion: []

# Advisory bodies that must be / have been consulted (drives the STATUS advisory table).
advisory_bodies: ["EESC", "CoR"]

