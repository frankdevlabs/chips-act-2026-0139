  - id: NL-NONPAPER-2026-04-17
    title: "Non-paper by the Netherlands — 'An Integrated Approach for the EU Tech Sovereignty Package' (Sovereign Tech Stack)"
    body: Netherlands
    date: 2026-04-17
    limite: false
    url: https://www.tweedekamer.nl/downloads/document?id=2026D18815
    mirror: https://www.rijksoverheid.nl/documenten/2026/04/20/nonpaperbythenetherlandsontheeutechsovereigntypackage
    local: sources/member-states/NL-NONPAPER-2026-04-17_integrated-approach-tech-sovereignty_2026-04-17.pdf
    notes: >-
      Dated The Hague, 17 April 2026; tabled around the informal Telecom Council of 20 April 2026
      (Kamerstuk series 21501-33; Tweede Kamer document 2026D18815). Argues for organising the
      package around a "Sovereign Tech Stack" with a demand–supply loop across the stack layers
      (raw materials/hardware/infrastructure up to software, data and applications) and open source
      as cross-cutting enabler. Covers the whole package, semiconductors included — same document
      registered in the sibling CADA tracker.
