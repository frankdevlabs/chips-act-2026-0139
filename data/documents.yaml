# Document register — the SINGLE source of truth for every official document on the file.
# sources/README.md is its *rendered* table (edit this YAML, then mirror the table; never the table alone).
#
# Field reference:
#   id            stable institutional id (COM-…, ST-…, WK-…, CM-…, OEIL-…, EESC-…)
#   title         quoted descriptive title
#   body          institution: Commission | Council | Parliament | EESC | CoR | <Member State> | …
#   date          ISO YYYY-MM-DD
#   limite        bool — true for Council LIMITE documents
#   url           authoritative URL (also: celex)
#   mirror        public copy when the authoritative URL is restricted (LIMITE)
#   register      Council register reference
#   national_parliament  national-parliament record hosting a LIMITE text
#   local / local_cover / local_annex / local_init / local_add1…  committed file path(s)
#   access        omit = fully public; else cite-only | screenshot-only | not-public |
#                 public-released | public-via-register | public-via-journalist | public-via-national-parliament
#   lead_source   (`>-` block, optional) credit the lead that surfaced the document when it reached the
#                 repo via something other than its own institutional feed (e.g. a T3 Bluesky tip): who/what
#                 flagged it, the watchlist code, the tip URL + date, one clause on why it counts as the lead
#   leading_service / mandatory_consultees / notes   prose context (notes is a `>-` block)

documents:
  - id: COM-2026-504
    title: "Chips Act 2.0 — proposal for a Regulation on a framework of measures for strengthening the Union's semiconductor ecosystem, repealing Regulation (EU) 2023/1781"
    body: Commission
    date: 2026-06-03
    limite: false
    url: https://digital-strategy.ec.europa.eu/en/library/proposal-chips-act-20
    celex: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0504
    local: sources/commission/COM-2026-504_proposal_2026-06-03.pdf
    local_annex: sources/commission/COM-2026-504_annexes-1-7_2026-06-03.pdf
    leading_service: "Lead service DG CNECT; political leads President von der Leyen and EVP Virkkunen (Tech Sovereignty, Security and Democracy)."
    mandatory_consultees: European Economic and Social Committee, European Committee of the Regions
    notes: >-
      The proposal this repo tracks — one of the two legislative halves of the European
      Technological Sovereignty Package (presented 3 June 2026 together with CADA, the EU Open
      Source Strategy and the Strategic Roadmap for Digitalisation and AI in Energy). 60 articles in
      eight Chapters; legal bases Art 173(3) + 114 TFEU; Text with EEA relevance. Repeals and
      replaces Regulation (EU) 2023/1781 (Art 58; correlation table in Annex VII). Accompanied by
      SEC(2026) 504, SWD(2026) 504 (impact assessment, 3 parts) and SWD(2026) 505 (executive
      summary). Annexes 1–7 committed separately (incl. Annex I Initiative actions, Annex II
      priority areas for strategic projects, Annex V critical sectors).

